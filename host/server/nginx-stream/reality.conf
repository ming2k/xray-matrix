# /etc/nginx/stream.d/reality.conf
#
# Layer-4 SNI demultiplexer that lets port 443 carry two identities at once:
#
#   * the hosted websites, with their own certificates, HTTP/2 and streaming
#     behaviour untouched (TLS terminated locally on 127.0.0.1:8443), and
#   * the Xray REALITY inbound, which borrows a third-party CDN's TLS identity
#     and must stay indistinguishable from that site.
#
# See ADR-0006 (`docs/adr/0006-port-443-ownership-l4-demux.md`) for the decision
# and the two invariants this file enforces. Three properties are load-bearing:
#
#   1. proxy_pass names an upstream GROUP, never a "host:port" variable. A
#      variable value is re-parsed per connection and drops connections with no
#      log entry anywhere: measured 12 failures in 50 attempts against 0 in 20
#      for the identical routing through group names.
#
#   2. Own domains are enumerated explicitly and `default` goes to the REALITY
#      branch, so a scanner with an arbitrary or missing SNI receives the
#      borrowed site's handshake or alert — never a local certificate
#      ([INV-CAMOUFLAGE-NO-LOCAL-CERT]).
#
#   3. Xray REALITY cannot consume a PROXY protocol header, so the REALITY
#      branch passes through 127.0.0.1:18443, which terminates the header and
#      forwards plain TCP to the Xray inbound.

upstream site_web {
    server 127.0.0.1:8443;
}

upstream reality_hop {
    server 127.0.0.1:18443;
}

# Only names that exist in DNS may reach the websites. Replace the placeholders:
# one line per own hostname, and the borrowed CDN name from
# docs/explanation/reality-target-selection.md.
map $ssl_preread_server_name $backend_443 {
    <OWN_HOSTNAME:example.com>          site_web;
    <OWN_HOSTNAME:www.example.com>      site_web;

    <BORROWED_NAME:cdn.example.com>     reality_hop;
    default                             reality_hop;
}

log_format demux '$remote_addr [$time_local] sni=$ssl_preread_server_name '
                 'backend=$backend_443 status=$status '
                 'sent=$bytes_sent recv=$bytes_received dur=$session_time';

server {
    access_log /var/log/nginx/stream.log demux;

    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $backend_443;
    proxy_protocol on;
    proxy_timeout 1h;        # long-lived tunnels and large downloads
    proxy_buffer_size 16k;   # must exceed the ClientHello record size
}

# PROXY-protocol stripping hop for the REALITY branch.
server {
    listen 127.0.0.1:18443 proxy_protocol;
    proxy_pass 127.0.0.1:10443;
    proxy_timeout 1h;
    proxy_buffer_size 16k;
}

# Optional alternate HTTPS entry, same demultiplexer on a non-standard port.
# Keep it only where the access network treats (ip, 443) differently from other
# ports; it is not proxyable by a CDN and needs its own firewall admission.
#
# server {
#     listen 8446;
#     ssl_preread on;
#     proxy_pass $backend_443;
#     proxy_protocol on;
#     proxy_timeout 1h;
#     proxy_buffer_size 16k;
