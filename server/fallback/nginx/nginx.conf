# Nginx Fallback Configuration for Xray TLS Fallback Architecture
# Receives connections forwarded by Xray from port 443 when client sends non-proxy traffic.
# Supports PROXY protocol (xver: 1) to recover authentic client IP addresses.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    # Extract real client IP from PROXY protocol sent by Xray fallbacks (xver: 1)
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    log_format proxy_combined '$proxy_protocol_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/fallback-access.log proxy_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        # Listen on localhost port 8080 with PROXY protocol enabled
        listen 127.0.0.1:8080 proxy_protocol;
        listen [::1]:8080 proxy_protocol;
        server_name _;

        root /var/www/fallback;
        index index.html index.htm;

        # Security headers for realistic appearance
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ =404;
        }

        # Handle ACME challenge if certbot or acme.sh uses webroot
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        # Custom 404 page
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
